<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a0b3d">
  <title>Брейнрот Мемы: Эволюция</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://yandex.ru/games/sdk/v2"></script>
</head>
<body>
  <div class="bg-decor" aria-hidden="true">
    <span class="bg-orb bg-orb--pink"></span>
    <span class="bg-orb bg-orb--cyan"></span>
    <span class="bg-orb bg-orb--gold"></span>
    <span class="bg-orb bg-orb--lime"></span>
    <span class="bg-grid"></span>
    <span class="bg-stars"></span>
    <span class="bg-glare"></span>
  </div>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand__logo" aria-hidden="true">🧠</span>
        <h1 id="titleText" class="brand__title">Брейнрот Мемы: Эволюция</h1>
      </div>
      <button id="soundBtn" type="button" class="sound-btn" aria-label="Звук">
        <span class="sound-btn__sticker" aria-hidden="true">🔊</span>
        <span id="soundBtnLabel" class="sound-btn__label">Звук</span>
      </button>
    </header>

    <main class="stage">
      <section class="board-zone">
        <div class="board-wrap">
          <div class="grid-wrap">
            <span class="grid-glow" aria-hidden="true"></span>
            <div id="board" class="board"></div>
            <div id="particles" class="particles"></div>
          </div>
        </div>
        <aside class="tip-strip" aria-labelledby="guideTitle">
          <span class="tip-strip__icon" aria-hidden="true">💡</span>
          <div class="tip-strip__inner">
            <h2 id="guideTitle" class="tip-strip__title">Как играть</h2>
            <div class="tip-strip__body scrollable">
              <p id="guideP1"></p>
              <p id="guideP2"></p>
              <p id="guideP3"></p>
              <p id="guideP4"></p>
            </div>
          </div>
        </aside>
      </section>

      <aside class="dock scrollable" aria-label="Панель действий">
        <section class="stats" aria-label="Статистика">
          <div class="stat stat--likes">
            <span class="stat-sticker" aria-hidden="true">❤️</span>
            <span id="likesLabel" class="stat-label">Лайки</span>
            <strong id="likesValue" class="stat-value">0</strong>
          </div>
          <div class="stat stat--income">
            <span class="stat-sticker" aria-hidden="true">📈</span>
            <span id="incomeLabel" class="stat-label">В секунду</span>
            <strong id="incomeValue" class="stat-value">0</strong>
            <span id="incomeMultHint" class="stat-sub"></span>
          </div>
          <div class="stat stat--crit">
            <span class="stat-sticker" aria-hidden="true">✨</span>
            <span id="critLabel" class="stat-label">Супер %</span>
            <strong id="critValue" class="stat-value">0%</strong>
          </div>
          <div class="stat stat--top">
            <span class="stat-sticker" aria-hidden="true">🏆</span>
            <span id="topLevelLabel" class="stat-label">Топ мем</span>
            <strong id="topLevelValue" class="stat-value">Lv.1</strong>
          </div>
        </section>

        <section class="dock-actions">
          <button id="spawnFreeBtn" type="button" class="btn btn-kid primary">
            <span class="btn-sticker" aria-hidden="true">🐱</span>
            <span class="btn-main">
              <span id="spawnFreeLabel" class="btn-title">Новый мем</span>
              <span class="btn-sub"><span id="spawnFreeSub">подождать</span> <span id="cooldownValue">5.0</span> сек</span>
            </span>
          </button>
          <button id="spawnPaidBtn" type="button" class="btn btn-kid gold">
            <span class="btn-sticker" aria-hidden="true">💸</span>
            <span class="btn-main">
              <span id="spawnPaidLabel" class="btn-title">Купить мем</span>
              <span class="btn-sub"><span id="spawnPriceValue">10</span> <span id="spawnPaidSub">лайки</span></span>
            </span>
          </button>
        </section>

        <section class="dock-ads" aria-label="Бонусы за рекламу">
          <button id="adBoostBtn" type="button" class="btn btn-kid accent btn-ad-col">
            <span class="btn-ad-row">
              <span class="btn-sticker sm" aria-hidden="true">📺</span>
              <span id="adBoostLabel" class="btn-title sm">Реклама: ×2 лайков 30 сек</span>
            </span>
            <span id="adBoostTimer" class="btn-ad-countdown" hidden></span>
          </button>
          <button id="adSpawnBtn" type="button" class="btn btn-kid accent">
            <span class="btn-sticker sm" aria-hidden="true">📺</span>
            <span id="adSpawnLabel" class="btn-title sm">Реклама: +5 мемов</span>
          </button>
          <button id="adInstantBtn" type="button" class="btn btn-kid accent">
            <span class="btn-sticker sm" aria-hidden="true">📺</span>
            <span id="adInstantLabel" class="btn-title sm">Реклама: Турбо 5 сек (кулдаун 0,3с)</span>
          </button>
        </section>

        <section class="shop">
          <h2 id="shopTitle" class="shop__title">Суперсилы</h2>
          <article class="upgrade-group upgrade-group--income">
            <div class="upgrade-head">
              <span class="upgrade-sticker" aria-hidden="true">💰</span>
              <h3 id="incomeUpgradeTitle">Больше лайков</h3>
            </div>
            <p id="incomeBonusPreview" class="bonus-preview"></p>
            <button id="buyIncomeUpgradeBtn" type="button" class="btn btn-kid shop-buy">
              <span class="btn-sticker sm" aria-hidden="true">⬆️</span>
              <span id="buyIncomeLabel">Улучшить</span>
              <span class="price-tag" id="incomeUpgradePrice">280</span>
            </button>
            <small id="incomeUpgradeLevel" class="upgrade-level">Уровень: 0/10</small>
          </article>
          <article class="upgrade-group upgrade-group--cooldown">
            <div class="upgrade-head">
              <span class="upgrade-sticker" aria-hidden="true">⏱️</span>
              <h3 id="cooldownUpgradeTitle">Быстрее кнопка</h3>
            </div>
            <p id="cooldownBonusPreview" class="bonus-preview"></p>
            <button id="buyCooldownUpgradeBtn" type="button" class="btn btn-kid shop-buy">
              <span class="btn-sticker sm" aria-hidden="true">⬆️</span>
              <span id="buyCooldownLabel">Улучшить</span>
              <span class="price-tag" id="cooldownUpgradePrice">260</span>
            </button>
            <small id="cooldownUpgradeLevel" class="upgrade-level">Уровень: 0/10</small>
          </article>
          <article class="upgrade-group upgrade-group--crit">
            <div class="upgrade-head">
              <span class="upgrade-sticker" aria-hidden="true">🌟</span>
              <h3 id="critUpgradeTitle">Супер слияние</h3>
            </div>
            <p id="critBonusPreview" class="bonus-preview"></p>
            <button id="buyCritUpgradeBtn" type="button" class="btn btn-kid shop-buy">
              <span class="btn-sticker sm" aria-hidden="true">⬆️</span>
              <span id="buyCritLabel">Улучшить</span>
              <span class="price-tag" id="critUpgradePrice">320</span>
            </button>
            <small id="critUpgradeLevel" class="upgrade-level">Уровень: 0/10</small>
          </article>
        </section>
      </aside>
    </main>

    <section id="offlinePanel" class="offline hidden" role="dialog" aria-modal="true" aria-labelledby="offlineTitle">
      <h2 id="offlineTitle">Ты отсутствовал!</h2>
      <p id="offlineText">Пока тебя не было, набежали лайки.</p>
      <div class="offline-actions">
        <button id="offlineClaimBtn" type="button" class="btn btn-kid primary">Забрать</button>
        <button id="offlineClaimAdBtn" type="button" class="btn btn-kid accent">
          <span class="btn-sticker sm" aria-hidden="true">📺</span>
          <span id="offlineClaimAdLabel">В два раза больше</span>
        </button>
      </div>
    </section>

    <div id="toast" class="toast"></div>
  </div>

  <script src="game.js"></script>
</body>
</html>
